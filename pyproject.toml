[project]
name = "kalshi-research-bot"
version = "0.1.0"
description = "Local research and modeling pipeline for Kalshi sports markets"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "psycopg_pool>=3.2,<4",
]

[project.optional-dependencies]
# Development only -- nothing here is imported at runtime, so the wheel is
# unchanged. Pinned exactly: an unpinned linter turns someone else's release
# into a red build on a pull request that did not touch the code it flags.
dev = ["ruff==0.15.8"]
browser = ["playwright==1.62.0"]

# Only `scripts/optimize_dashboard_fonts.py` needs these, and only when the
# shipped woff2 files are rebuilt. Serving the dashboard does not, so they stay
# out of the runtime set: `pip install -e .[fonts]` to run that script.
fonts = ["fonttools[woff]>=4.50"]

[tool.ruff]
# Codespaces, CI, and Railway all use Python 3.12. Keeping the declared floor
# and lint target aligned prevents environment-specific syntax surprises.
target-version = "py312"

[tool.ruff.lint]
# Pyflakes only, and deliberately only that.
#
# Every rule here is justified by a defect this repository actually had:
#
#   F401  unused import      -- seven removed in #89, accumulated because
#                               nothing looked
#   F811  redefinition       -- same family; a second definition silently wins
#   F821  undefined name     -- `model-audit` used `Path` in two function bodies
#                               and never imported it. `from __future__ import
#                               annotations` made the signatures lazy, so the
#                               command raised NameError at call time instead of
#                               failing on import. Verified: ruff flags exactly
#                               that shape.
#   F841  unused variable    -- `sports_state_label` computed a heading nothing
#                               rendered, removed alongside this change
#
# E/W were measured at 3090 violations and are style, not defects; B, SIM and UP
# at 39, 19 and 48, none of them tied to a bug this project has had. A gate that
# demands a thousand-line reformat before it can go green does not get adopted,
# and one that fires on correct code gets switched off. This one starts at zero.
select = ["F"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The dashboard stylesheet, scripts, and self-hosted font ship with the wheel;
# without this an installed copy serves a dashboard with no styling.
"kalshi_research_bot.dashboard_assets" = ["*.css", "*.js", "*.woff2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
