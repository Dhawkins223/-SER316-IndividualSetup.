name: PostgreSQL validation

on:
  pull_request:
  push:
    branches:
      - Master

permissions:
  contents: read

# One run per branch. Pushing twice in a minute used to leave both runs going,
# and this workflow starts a PostgreSQL service and a Chromium download in
# every one of them -- superseded runs are answering a question nobody is
# waiting for, on minutes that are metered.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src:.
      APP_ENV: test
      SMOKE: "1"
      SMOKE_ARTIFACT_DIR: /tmp/hawknetic-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install browser test dependencies
        run: python -m pip install -e '.[browser]'
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install Chromium and system libraries
        run: python -m playwright install --with-deps chromium
      - name: Check all dashboard roles, states, and widths
        run: python scripts/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-browser-checks
          path: /tmp/hawknetic-browser
          if-no-files-found: ignore
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: hawknetic_ci
          POSTGRES_PASSWORD: hawknetic_ci_only
          POSTGRES_DB: hawknetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hawknetic_ci -d hawknetic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PYTHONPATH: src:.
      DATABASE_MIGRATION_MODE: apply
      APP_ENV: test
      POSTGRES_USER: hawknetic_ci
      POSTGRES_PASSWORD: hawknetic_ci_only
      POSTGRES_DB: hawknetic
      POSTGRES_TEST_DB: hawknetic
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://hawknetic_ci:hawknetic_ci_only@127.0.0.1:5432/hawknetic
      TEST_DATABASE_URL: postgresql://hawknetic_ci:hawknetic_ci_only@127.0.0.1:5432/hawknetic
      RESEARCH_ONLY: "true"
      LIVE_EXECUTION_ENABLED: "false"
      AUTO_TRADE_ENABLED: "false"
      AUTO_UPLOAD_ENABLED: "false"
      KALSHI_ORDER_UPLOAD_ENABLED: "false"
      MODEL_PROMOTION_ENABLED: "false"
      STALE_CACHE_AS_FRESH: "false"
      DASHBOARD_REQUIRE_AUTH_WHEN_HOSTED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Validate cloud development configuration
        run: |
          python -m json.tool .devcontainer/devcontainer.json >/dev/null
          bash -n .devcontainer/*.sh scripts/local.sh
          python - <<'PY'
          import re
          from pathlib import Path

          keys = {
              line.split("=", 1)[0]
              for line in Path(".env.example").read_text(encoding="utf-8").splitlines()
              if re.fullmatch(r"[A-Z][A-Z0-9_]*=.*", line)
          }
          inventory = Path("docs/environment-variables.md").read_text(encoding="utf-8")
          missing = sorted(key for key in keys if f"`{key}`" not in inventory)
          if missing:
              raise SystemExit("environment variables missing from inventory: " + ", ".join(missing))
          PY
      - name: Build installable package
        run: python -m pip wheel . --no-deps --wheel-dir /tmp/hawknetic-wheel
      # Before the database work, because it takes about a second and the rest
      # of this job takes minutes. Rules and their justification live in
      # pyproject.toml; `ruff check` exits non-zero on a finding, so this is a
      # gate rather than a report.
      #
      # The whole tree, not `src/ tests/`: `run_paper.py` and
      # `scripts/browser_validation_server.py` are executable entry points that
      # live outside both, and a gate that does not reach the code someone
      # actually runs is a gate with a hole in it.
      - name: Lint
        run: python -m ruff check .
      - name: Validate Compose configuration
        run: docker compose -f compose.yml config --quiet
      - name: Apply migrations from an empty database
        run: python -m kalshi_research_bot.db_command migrate
      - name: Repeat migrations safely
        run: python -m kalshi_research_bot.db_command migrate
      - name: Validate Railway migration-only command
        run: PYTHONPATH=src python -m kalshi_research_bot database-migrate
      - name: Serialize concurrent migrations
        run: python -m unittest tests.test_postgres_integrity.PostgresIntegrityTests.test_migration_lock_serializes_concurrent_migrators -v
      - name: Validate retired-engine absence
        run: |
          python - <<'PY'
          from pathlib import Path

          needle = "sqli" + "te"
          forbidden = (
              needle,
              needle + "3",
              "EVALUATION" + "_DB_PATH",
              "AUTH" + "_DB_PATH",
              "OPERATOR_INBOX" + "_DB_PATH",
              "ALLOW_HOSTED" + "_" + needle.upper() + "_RUNTIME",
              "Research" + "Store",
              "Legacy" + needle.title() + "ArchiveStore",
          )
          matches = []
          for path in Path(".").rglob("*"):
              if ".git" in path.parts or not path.is_file():
                  continue
              if needle in path.name.lower() or path.suffix.lower() in {"." + needle, "." + needle + "3", ".db"}:
                  matches.append(str(path))
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if any(value.lower() in content.lower() for value in forbidden):
                  matches.append(str(path))
          if matches:
              raise SystemExit("retired persistence references: " + ", ".join(matches))
          PY
      - name: Verify CI cannot target hosted infrastructure
        run: |
          test -z "${RAILWAY_TOKEN:-}"
          test -z "${RAILWAY_API_TOKEN:-}"
          test -z "${RAILWAY_ENVIRONMENT:-}"
          test -z "${RAILWAY_PROJECT_ID:-}"
      - name: Application startup and protected endpoint smoke tests
        run: python -m unittest tests.test_internal_endpoint tests.test_paper_server_auth -v
      - name: Run canonical Codespaces database workflow
        run: |
          cp .env.example .env
          # The service container above occupies host port 5432. Keep the
          # Compose-backed Codespaces workflow on its documented private port.
          POSTGRES_PORT=54329 POSTGRES_TEST_DB=hawknetic_test ./scripts/local.sh test
          POSTGRES_PORT=54329 POSTGRES_TEST_DB=hawknetic_test ./scripts/local.sh smoke
          POSTGRES_PORT=54329 POSTGRES_TEST_DB=hawknetic_test ./scripts/local.sh verify
      - name: Start Codespaces dashboard and probe health
        run: |
          POSTGRES_PORT=54329 POSTGRES_TEST_DB=hawknetic_test DASHBOARD_HOST=0.0.0.0 PORT=8765 ./scripts/local.sh dev >/tmp/hawknetic-dashboard.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/healthz >/tmp/healthz.json; then
              break
            fi
            sleep 1
          done
          test "$(python -c 'import json; print(json.load(open("/tmp/healthz.json"))["status"])')" = "ok"
          ready_code="$(curl -sS -o /tmp/readyz.json -w '%{http_code}' http://127.0.0.1:8765/readyz)"
          test "$ready_code" = "503"
          python - <<'PY'
          import json

          with open("/tmp/readyz.json", encoding="utf-8") as handle:
              readiness = json.load(handle)
          assert readiness["status"] == "blocked"
          assert readiness["database"]["ready"] is True
          assert readiness["data_gate"] != "ready"
          PY
